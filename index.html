<style>
  :root{
    --bg:#EEF1F4; --surface:#FFFFFF; --ink:#23272B; --ink-2:#5B6470; --ink-3:#8A93A0;
    --line:#E3E7EC; --brand:#0E4F5B; --brand-2:#14727F; --brand-ink:#FFFFFF;
    --present:#2E9E5B; --late:#E8A13C; --leave:#2F6FED; --absent:#D64545;
    --danger:#D64545;
    --radius:10px;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.5; min-height:100vh;
  }
  .wrap{max-width:880px; margin:0 auto; padding:0 14px 48px;}

  /* ===== 顶部 ===== */
  .topbar{background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); box-shadow:0 1px 8px rgba(16,24,40,.04);}
  .topbar-in{max-width:880px; margin:0 auto; padding:16px 14px; display:flex; flex-direction:column; gap:12px;}
  .brand{display:flex; align-items:center; gap:12px; min-width:0;}
  .brand .logo{width:40px; height:40px; border-radius:50%; background:#fff; box-shadow:0 2px 8px rgba(14,79,91,.16); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden;}
  .brand .logo img{width:34px; height:34px; object-fit:contain;}
  .brand h1{font-size:20px; font-weight:700; letter-spacing:.5px; color:var(--ink);}
  .brand .sub{font-size:12px; color:var(--ink-3); margin-top:1px;}
  .datefield{display:flex; align-items:center; gap:8px;}
  .datefield label{font-size:13px; color:var(--ink-2); white-space:nowrap;}
  .datefield input[type=date]{
    font:inherit; font-size:16px; color:var(--ink); padding:8px 10px; min-height:44px;
    border:1px solid var(--line); border-radius:8px; background:#FBFCFD; flex:1; max-width:220px;
  }
  .datefield input[type=date]:focus{outline:2px solid rgba(20,114,127,.35); border-color:var(--brand-2);}

  /* ===== 统计条 ===== */
  .stats{display:flex; flex-wrap:wrap; align-items:stretch; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-top:16px; overflow:hidden;}
  .stat{flex:1 1 33%; display:flex; align-items:center; gap:8px; padding:12px 14px; min-width:0;}
  .stat + .stat{border-left:1px solid var(--line);}
  .stat .dot{width:8px; height:8px; border-radius:50%; flex:none;}
  .stat b{font-size:17px; font-weight:700; font-variant-numeric:tabular-nums;}
  .stat span{font-size:12px; color:var(--ink-2);}
  .dot-total{background:var(--ink-3);} .dot-present{background:var(--present);} .dot-late{background:var(--late);}
  .dot-leave{background:var(--leave);} .dot-absent{background:var(--absent);}

  /* ===== 名单 ===== */
  .sheet{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); margin-top:14px;}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .sheet-head h2{font-size:15px; font-weight:600;}
  .search{
    font:inherit; font-size:14px; min-height:36px; padding:0 12px; width:180px;
    border:1px solid var(--line); border-radius:8px; background:#FBFCFD; color:var(--ink);
  }
  .search:focus{outline:none; border-color:var(--brand-2); box-shadow:0 0 0 3px rgba(20,114,127,.12);}
  @media (max-width:767px){ .sheet-head{flex-wrap:wrap;} .search{flex:1 1 100%; width:auto; order:3;} }
  .sheet-head .meta{font-size:12px; color:var(--ink-3);}
  .row{display:flex; flex-direction:column; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .row-top{display:flex; align-items:center; gap:12px; min-width:0;}
  .row .idx{font-size:12px; color:var(--ink-3); width:30px; flex:none; font-variant-numeric:tabular-nums;}
  .row .name{font-size:15px; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .row .del{
    flex:none; width:44px; height:44px; margin-right:-8px; border:none; background:transparent; border-radius:8px;
    color:var(--ink-3); cursor:pointer; font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center;
  }
  .row .del:hover{color:var(--danger); background:#FCEBEB;}
  .statuses{display:flex; flex-wrap:wrap; gap:8px; padding-left:42px;}
  .st-btn{
    flex:1 1 auto; min-width:56px; min-height:44px; padding:8px 10px; border-radius:8px; cursor:pointer;
    font:inherit; font-size:14px; font-weight:500; color:var(--ink-2); background:#F5F7F9; border:1px solid var(--line);
    display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:background .12s,border-color .12s,color .12s;
  }
  .st-btn:hover{border-color:var(--ink-3);}
  .st-btn .sd{width:7px; height:7px; border-radius:50%; background:currentColor; flex:none; opacity:.55;}
  .st-btn[data-s="present"]{color:var(--present);}
  .st-btn[data-s="late"]{color:var(--late);}
  .st-btn[data-s="leave"]{color:var(--leave);}
  .st-btn[data-s="absent"]{color:var(--absent);}
  .st-btn.on{color:#fff; border-color:transparent;}
  .st-btn.on.present{background:var(--present);} .st-btn.on.late{background:var(--late);}
  .st-btn.on.leave{background:var(--leave);} .st-btn.on.absent{background:var(--absent);}
  .st-btn.on .sd{opacity:1; color:rgba(255,255,255,.9);}
  .st-btn.clear{
    min-width:44px; width:44px; flex:0 0 auto; padding:0; font-size:16px; color:var(--ink-3); background:transparent; border-color:transparent;
  }
  .st-btn.clear:hover{color:var(--danger); background:#FCEBEB; border-color:transparent;}

  /* ===== 空态 ===== */
  .empty{padding:40px 20px; text-align:center; color:var(--ink-2); font-size:14px;}

  /* ===== 工具栏 ===== */
  .tools{display:flex; flex-direction:column; gap:12px; margin-top:14px;}
  .btn{
    font:inherit; font-size:15px; font-weight:600; min-height:46px; padding:0 16px; border-radius:10px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid transparent; white-space:nowrap;
  }
  .btn.primary{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:var(--brand-ink); box-shadow:0 3px 10px rgba(14,79,91,.22);}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line);}
  .btn.ghost:hover{border-color:var(--ink-3);}
  .btn.danger-ghost{background:var(--surface); color:var(--danger); border-color:var(--line);}
  .btn.danger-ghost:hover{border-color:var(--danger); background:#FCEBEB;}
  .actbar{display:flex; flex-wrap:wrap; gap:8px;}
  .actbar .spacer{flex:1;}
  .exportbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .exportbar .hint{font-size:12px; color:var(--ink-3); flex:1 1 100%;}
  .btn.export{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%); color:var(--brand-ink); box-shadow:0 3px 10px rgba(14,79,91,.22);}
  .btn.export:hover{filter:brightness(1.08);}
  .btn.export.alt{background:#FFFFFF; color:var(--brand); border-color:var(--brand);}
  .btn.export.alt:hover{background:#EEF6F7;}

  .foot-note{margin-top:18px; font-size:12px; color:var(--ink-3); text-align:center;}

  /* ===== 卡密门 ===== */
  #gate{
    position:fixed; inset:0; z-index:100;
    background:linear-gradient(165deg,#EAF1F3 0%,#EEF1F4 45%,#DFE9EC 100%);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #gate[hidden]{display:none;}
  .gate-card{
    width:100%; max-width:370px; background:var(--surface);
    border:1px solid #E8EDF0; border-radius:20px;
    box-shadow:0 12px 40px rgba(14,79,91,.14), 0 2px 8px rgba(16,24,40,.05);
    padding:34px 28px 26px; text-align:center;
    animation:gateIn .45s cubic-bezier(.2,.8,.3,1);
  }
  @keyframes gateIn{from{opacity:0; transform:translateY(14px) scale(.97);} to{opacity:1; transform:none;}}
  .gate-card .glogo{
    width:72px; height:72px; margin:0 auto 16px; display:flex;
    align-items:center; justify-content:center;
    filter:drop-shadow(0 4px 10px rgba(14,79,91,.22));
  }
  .gate-card .glogo img{width:72px; height:72px; object-fit:contain;}
  .gate-card h2{font-size:20px; letter-spacing:1px; color:var(--ink);}
  .gate-card p{font-size:13px; color:var(--ink-2); margin:8px 0 20px;}
  .gate-card input{
    width:100%; font:inherit; font-size:17px; min-height:48px; padding:0 14px;
    border:1.5px solid var(--line); border-radius:12px; background:#FBFCFD; color:var(--ink);
    letter-spacing:3px; text-align:center; transition:border-color .15s, box-shadow .15s;
  }
  .gate-card input:focus{outline:none; border-color:var(--brand-2); box-shadow:0 0 0 4px rgba(20,114,127,.12);}
  .gate-card .btn{
    width:100%; margin-top:14px; min-height:48px; border-radius:12px; font-size:16px;
    background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);
    box-shadow:0 4px 14px rgba(14,79,91,.28); transition:transform .12s, box-shadow .12s;
  }
  .gate-card .btn:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(14,79,91,.32);}
  .gate-card .btn:active{transform:translateY(0);}
  .gate-err{font-size:13px; color:var(--danger); text-align:center; min-height:18px; margin-top:12px;}

  /* ===== toast ===== */
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translate(-50%,16px); z-index:99;
    background:#23272B; color:#fff; font-size:14px; padding:10px 18px; border-radius:10px;
    box-shadow:0 6px 20px rgba(0,0,0,.18); opacity:0; pointer-events:none; transition:opacity .18s,transform .18s;
    max-width:calc(100vw - 40px);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ===== 桌面 ===== */
  @media (min-width:768px){
    .topbar-in{flex-direction:row; align-items:center; justify-content:space-between; padding:18px 0;}
    .wrap{padding:0 20px 56px;}
    .brand h1{font-size:22px;}
    .stat{flex:1 1 20%;}
    .row{flex-direction:row; align-items:center; gap:14px; padding:10px 16px;}
    .row-top{flex:0 0 220px; gap:10px;}
    .statuses{flex:1; padding-left:0; gap:8px;}
    .st-btn{flex:0 1 auto; min-width:76px; min-height:40px; padding:6px 12px;}
    .st-btn.clear{width:44px; min-width:44px;}
    .actbar{flex:0 0 auto;}
    .exportbar .hint{flex:1 1 auto;}
  }
</style>
</head>

    <h2>高三2组出勤表</h2>
    <p>请输入卡密访问</p>
    <input type="text" id="keyInput" placeholder="输入卡密" autocomplete="off" maxlength="32">
    <button class="btn primary" id="keyBtn">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<div id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  /* ★ 卡密列表：在这里增删卡密，改完刷新生效 ★ */
  var KEYS = ["2008"];
  var KEY_AUTH = "att.auth.v1";

  function keyHash(s){
    var h = 5381;
    for(var i=0;i<s.length;i++){ h = ((h<<5) + h + s.charCodeAt(i)) >>> 0; }
    return String(h);
  }
  var KEY_HASHES = KEYS.map(keyHash);

  /* ===== 卡密验证 ===== */
  var $g = function(id){ return document.getElementById(id); };
  var gate = $g("gate"), keyInput = $g("keyInput"), keyBtn = $g("keyBtn"), gateErr = $g("gateErr");
  try{ if(localStorage.getItem(KEY_AUTH) === "1"){ gate.hidden = true; } }catch(e){}

  function tryKey(){
    var k = (keyInput.value || "").trim();
    if(!k){ gateErr.textContent = "请输入卡密"; return; }
    if(KEY_HASHES.indexOf(keyHash(k)) === -1){
      gateErr.textContent = "卡密不正确，请重试";
      keyInput.select();
      return;
    }
    try{ localStorage.setItem(KEY_AUTH, "1"); }catch(e){}
    gate.hidden = true;
    toast("验证成功，欢迎回来");
  }
  keyBtn.addEventListener("click", tryKey);
  keyInput.addEventListener("keydown", function(ev){ if(ev.key === "Enter") tryKey(); });

  /* ===== 数据 ===== */
  var KEY_PEOPLE = "att.people.v2";
  var KEY_REC    = "att.records.v2";
  var STATUS = [
    { key:"present", label:"出勤", cls:"present" },
    { key:"late",    label:"迟到", cls:"late"    },
    { key:"leave",   label:"请假", cls:"leave"   },
    { key:"absent",  label:"缺席", cls:"absent"  }
  ];
  /* ★ 预设名单：直接在这里改名字即可，改完刷新页面生效 ★ */
  var NAMES = ["沈政钦","邢书豪","王紫正","梁浩然","赵硕","贾绍严","任前程","曹子恒","吴岳洋","王文浩","澹依涵","王梓贺","李雨桐","田子昂","王一凡","陈政勋","吴昌庭","王森","陈子怡","陈宣任","杨舒然","吴艳阳","李恩同","杨宇轩","闫柳燃","安政臣"];

  var people = loadPeople();   // [{id, name}]
  var records = loadRecords(); // { "YYYY-MM-DD": { id: key } }
  var today = fmtDate(new Date());
  var curDate = today;
  if(!people.length){
    people = NAMES.map(function(nm){ return { id: "n_" + nm, name: nm }; });
    savePeople();
  }

  function loadPeople(){
    try{ var v = JSON.parse(localStorage.getItem(KEY_PEOPLE)); if(Array.isArray(v)) return v; }catch(e){}
    return [];
  }
  function loadRecords(){
    try{ var v = JSON.parse(localStorage.getItem(KEY_REC)); if(v && typeof v === "object") return v; }catch(e){}
    return {};
  }
  function savePeople(){ try{ localStorage.setItem(KEY_PEOPLE, JSON.stringify(people)); }catch(e){} }
  function saveRecords(){ try{ localStorage.setItem(KEY_REC, JSON.stringify(records)); }catch(e){} }

  function fmtDate(d){
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear() + "-" + (m<10?"0":"") + m + "-" + (day<10?"0":"") + day;
  }
  function nextId(){
    var max = 0;
    people.forEach(function(p){ var n = parseInt(p.id,10); if(!isNaN(n) && n > max) max = n; });
    return String(max + 1);
  }

  /* ===== DOM ===== */
  var $ = function(id){ return document.getElementById(id); };
  var dateInput = $("date"), listEl = $("list"), emptyEl = $("empty"),
      statsEl = $("stats"), sheetTitle = $("sheetTitle"), sheetMeta = $("sheetMeta"),
      toastEl = $("toast");

  dateInput.value = today;
  dateInput.addEventListener("change", function(){ curDate = dateInput.value || today; render(); });

  /* ===== 渲染 ===== */
  function render(){
    renderStats();
    renderList();
  }

  function renderStats(){
    var rec = records[curDate] || {};
    var n = { present:0, late:0, leave:0, absent:0 };
    people.forEach(function(p){ var k = rec[p.id]; if(k && n[k] !== undefined) n[k]++; });
    var items = [
      { key:"total",   label:"应到", val:people.length, dot:"dot-total" },
      { key:"present", label:"出勤", val:n.present,     dot:"dot-present" },
      { key:"late",    label:"迟到", val:n.late,        dot:"dot-late" },
      { key:"leave",   label:"请假", val:n.leave,       dot:"dot-leave" },
      { key:"absent",  label:"缺席", val:n.absent,      dot:"dot-absent" }
    ];
    var html = "";
    items.forEach(function(it){
      html += '<div class="stat"><span class="dot ' + it.dot + '" aria-hidden="true"></span><b>' + it.val + '</b><span>' + it.label + '</span></div>';
    });
    statsEl.innerHTML = html;
  }

  var searchBox = $("searchBox");
  var searchKw = "";
  searchBox.addEventListener("input", function(){
    searchKw = (searchBox.value || "").trim().toLowerCase();
    renderList();
  });

  function renderList(){
    sheetTitle.textContent = curDate + " 考勤";
    sheetMeta.textContent = people.length ? "共 " + people.length + " 人" : "尚未添加成员";
    var rec = records[curDate] || {};
    if(!people.length){ listEl.innerHTML = ""; emptyEl.hidden = false; return; }
    emptyEl.hidden = true;

    var shown = people;
    if(searchKw){
      shown = people.filter(function(p){ return p.name.toLowerCase().indexOf(searchKw) !== -1; });
      sheetMeta.textContent = "搜索到 " + shown.length + " / " + people.length + " 人";
    }
    if(!shown.length){
      listEl.innerHTML = '<div class="empty">没有匹配「' + esc(searchKw) + '」的成员</div>';
      return;
    }

    var html = "";
    shown.forEach(function(p, i){
      var cur = rec[p.id] || "";
      html += '<div class="row" data-id="' + p.id + '">';
      html += '  <div class="row-top">';
      html += '    <span class="idx">' + pad(i+1) + '</span>';
      html += '    <span class="name">' + esc(p.name) + '</span>';
      html += '  </div>';
      html += '  <div class="statuses">';
      STATUS.forEach(function(s){
        var on = (cur === s.key);
        html += '<button class="st-btn ' + (on ? "on " + s.cls : "") + '" data-s="' + s.key + '" aria-pressed="' + on + '">' +
                '<span class="sd" aria-hidden="true"></span>' + s.label + '</button>';
      });
      html += '    <button class="st-btn clear" data-s="clear" title="清除该成员今日状态" aria-label="清除状态">×</button>';
      html += '  </div>';
      html += '</div>';
    });
    listEl.innerHTML = html;
  }

  function pad(n){ return n < 10 ? "0" + n : String(n); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  }); }

  /* ===== 交互：状态点选 ===== */
  listEl.addEventListener("click", function(ev){
    var btn = ev.target.closest("button");
    if(!btn) return;
    var row = btn.closest(".row");
    if(!row) return;
    var id = row.getAttribute("data-id");
    var s = btn.getAttribute("data-s");
    if(!s || !id) return;

    if(!records[curDate]) records[curDate] = {};
    if(s === "clear"){
      delete records[curDate][id];
      toast("已清除 " + nameOf(id) + " 的今日记录");
    } else {
      if(records[curDate][id] === s){
        delete records[curDate][id];
        toast("已取消" + STATUS.find(function(x){return x.key===s;}).label + "标记");
      } else {
        records[curDate][id] = s;
      }
    }
    saveRecords();
    render();
  });

  function nameOf(id){
    for(var i=0;i<people.length;i++){ if(people[i].id === id) return people[i].name; }
    return "";
  }

  /* ===== 名单管理 ===== */
  function loadPresetList(){
    people = NAMES.map(function(nm){ return { id: "n_" + nm, name: nm }; });
    savePeople();
    render();
    toast("已载入预设名单（共 " + people.length + " 人）");
  }

  $("resetListBtn").addEventListener("click", function(){
    loadPresetList();
  });

  $("allPresentBtn").addEventListener("click", function(){
    if(!people.length){ toast("名单为空"); return; }
    if(!records[curDate]) records[curDate] = {};
    people.forEach(function(p){ records[curDate][p.id] = "present"; });
    saveRecords(); render();
    toast("已将所有成员标记为出勤");
  });

  $("clearDayBtn").addEventListener("click", function(){
    if(!people.length){ toast("名单为空"); return; }
    if(!records[curDate]){ toast("今日还没有任何记录"); return; }
    delete records[curDate];
    saveRecords(); render();
    toast("已清空今日记录");
  });

  /* ===== 导出 ===== */
  function buildRows(){
    var rec = records[curDate] || {};
    var rows = [["序号","姓名","考勤状态"]];
    people.forEach(function(p, i){
      var k = rec[p.id];
      var label = k ? (STATUS.find(function(x){return x.key===k;}) || {}).label : "未记录";
      rows.push([pad(i+1), p.name, label]);
    });
    return rows;
  }
  function download(blob, filename){
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }
  function exportFile(){
    if(!people.length){ toast("名单为空，无法导出"); return null; }
    return "高三2组出勤表_" + curDate;
  }

  /* ===== 生成真正的 .xlsx（无压缩 ZIP，内置实现，不依赖外部库） ===== */
  var CRC_TABLE = (function(){
    var t = new Array(256), c, n, k;
    for(n = 0; n < 256; n++){
      c = n;
      for(k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes){
    var c = 0xFFFFFFFF;
    for(var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function u16(v){ return [v & 0xFF, (v >> 8) & 0xFF]; }
  function u32(v){ return [v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF]; }

  function makeZip(files){ // files: [{name, data(Uint8Array)}]
    var localParts = [], centralParts = [], offset = 0;
    files.forEach(function(f){
      var nameBytes = new TextEncoder().encode(f.name);
      var crc = crc32(f.data);
      var local = [].concat(
        u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0)
      );
      localParts.push(new Uint8Array(local), nameBytes, f.data);
      var central = [].concat(
        u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
        u32(crc), u32(f.data.length), u32(f.data.length),
        u16(nameBytes.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset)
      );
      centralParts.push(new Uint8Array(central), nameBytes);
      offset += local.length + nameBytes.length + f.data.length;
    });
    var centralSize = centralParts.reduce(function(s, p){ return s + p.length; }, 0);
    var end = new Uint8Array([].concat(
      u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
      u32(centralSize), u32(offset), u16(0)
    ));
    var all = localParts.concat(centralParts, [end]);
    var total = all.reduce(function(s, p){ return s + p.length; }, 0);
    var out = new Uint8Array(total), pos = 0;
    all.forEach(function(p){ out.set(p, pos); pos += p.length; });
    return out;
  }

  function xmlEscape(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
    });
  }

  function makeXlsx(rows){ // rows: [[..], [..]]
    /* 使用 sharedStrings 写法（微信/轻量预览器不支持 inlineStr） */
    var sst = [], sstIdx = {};
    function sIdx(v){
      var key = String(v);
      if(sstIdx[key] === undefined){ sstIdx[key] = sst.length; sst.push(key); }
      return sstIdx[key];
    }
    var sheetRows = rows.map(function(r, ri){
      var cells = r.map(function(c, ci){
        var col = String.fromCharCode(65 + ci); // 最多3列，够用
        return '<c r="' + col + (ri+1) + '" t="s"><v>' + sIdx(c) + '</v></c>';
      }).join("");
      return '<row r="' + (ri+1) + '">' + cells + '</row>';
    }).join("");
    var sstXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="' + (sst.length) + '" uniqueCount="' + sst.length + '">' +
      sst.map(function(s){ return '<si><t>' + xmlEscape(s) + '</t></si>'; }).join("") +
      '</sst>';
    var files = [
      { name:"[Content_Types].xml", data:new TextEncoder().encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
        '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
        '<Default Extension="xml" ContentType="application/xml"/>' +
        '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
        '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
        '<Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/>' +
        '</Types>') },
      { name:"_rels/.rels", data:new TextEncoder().encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
        '</Relationships>') },
      { name:"xl/workbook.xml", data:new TextEncoder().encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
        '<sheets><sheet name="高三2组出勤表" sheetId="1" r:id="rId1"/></sheets></workbook>') },
      { name:"xl/_rels/workbook.xml.rels", data:new TextEncoder().encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
        '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
        '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/>' +
        '</Relationships>') },
      { name:"xl/sharedStrings.xml", data:new TextEncoder().encode(sstXml) },
      { name:"xl/worksheets/sheet1.xml", data:new TextEncoder().encode(
        '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
        '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
        sheetRows + '</sheetData></worksheet>') }
    ];
    return makeZip(files);
  }

  $("exportXlsBtn").addEventListener("click", function(){
    var base = exportFile(); if(!base) return;
    var rows = buildRows();
    var bytes = makeXlsx(rows);
    download(new Blob([bytes], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), base + ".xlsx");
    toast("已导出 Excel（.xlsx）");
  });

  $("exportCsvBtn").addEventListener("click", function(){
    var base = exportFile(); if(!base) return;
    var rows = buildRows();
    var csv = rows.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\r\n");
    download(new Blob(["\ufeff" + csv], { type:"text/csv;charset=utf-8" }), base + ".csv");
    toast("已导出 CSV 文件");
  });

  /* ===== toast ===== */
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2000);
  }

  /* ===== 初始化 ===== */
  render();
})();
</script>
</body>
</html>
